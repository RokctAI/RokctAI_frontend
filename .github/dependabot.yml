version: 2
updates:
  # Maintain Pip (Frappe/Python)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    # SAFETY: Creates PRs only. Does NOT auto-merge.

  # NPM: no Dependabot here. npm versions are shared fleet-wide in
  # core base/nextjs manifest.json "versions" (like Dart's base SDK) and
  # reach this shell through the SDK refresh.
