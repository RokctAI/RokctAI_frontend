# Guided tour fragment: control persona, fleet board (federated hubs WP1b).
#
# A fragment, not tour/app.tour.yaml: this shell has no tour manifest yet, so
# adding app.tour.yaml would switch on the guided-tour workflow before its
# runner exists. The manifest includes this file once it lands. Run the build
# with ROKCT_DEMO_DATA=1 so the board shows the fixtures in
# app/lib/fleet/demo.ts (one docker of each health colour, server agents,
# company links and move jobs).
fragment: control-fleet
persona: control
requires_role: System Manager
env:
  ROKCT_DEMO_DATA: "1"
steps:
  - id: fleet_board
    route: /handson/control/fleet
    target: '[data-tour="fleet-summary"]'
    caption: Every docker the hub runs, counted by heartbeat health. Tap a colour to filter.
  - id: fleet_list
    route: /handson/control/fleet
    target: '[data-tour="fleet-list"]'
    caption: Dockers grouped by server, with last beat, settings applied versus desired, and site count. A red docker shows when its alert opened and what the outside probe saw; drift marks sites the registry does not know.
  - id: fleet_servers
    route: /handson/control/fleet
    target: '[data-tour="fleet-servers"]'
    caption: The server agent on each machine. Issue a one-time token to enrol an agent or a new docker, or rotate an agent's key.
  - id: fleet_detail
    route: /handson/control/fleet/tenant-a71q
    target: '[data-tour="fleet-placements"]'
    caption: Open a docker to see its sites and where each tenant stands in its lifecycle.
  - id: fleet_usage
    route: /handson/control/fleet/tenant-a71q
    target: '[data-tour="fleet-revisions"]'
    caption: Recent usage samples and the settings revisions the hub issued, newest first.
  - id: fleet_actions
    route: /handson/control/fleet/tenant-a71q
    target: '[data-tour="fleet-actions"]'
    caption: Stop, start or restore the docker, rotate its key, extend, move, export, restore or remove a tenant, or drive a rollout. Each asks to confirm; in demo mode nothing is sent.
  - id: fleet_moves
    route: /handson/control/fleet/tenant-a71q
    target: '[data-tour="fleet-moves"]'
    caption: Moves from or to this docker, with postpone, abort and rollback (a switched move, while the old site is kept), and the company links that join its companies to other dockers.
