<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-label="A leave request for five days with Approve and Decline buttons"><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15151c"/><stop offset="1" stop-color="#0c0c10"/></linearGradient><radialGradient id="g1" cx="0.22" cy="0.18" r="0.6"><stop offset="0" stop-color="#facc15" stop-opacity="0.34"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></radialGradient><radialGradient id="g2" cx="0.85" cy="0.9" r="0.55"><stop offset="0" stop-color="#6366f1" stop-opacity="0.16"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.055"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/></filter><linearGradient id="yel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><linearGradient id="ind" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="720" height="500" fill="url(#bg)"/><rect width="720" height="500" fill="url(#g1)"/><rect width="720" height="500" fill="url(#g2)"/><rect width="720" height="500" fill="url(#dots)"/><rect x="140" y="50" width="440" height="400" rx="18" fill="#1b1b23" stroke="#2c2c38" filter="url(#sh)"/><text x="170" y="98" font-size="24" font-weight="700" fill="#e4e4e7">Leave request</text><rect x="456" y="78" width="94" height="28" rx="14.0" fill="#6366f1" fill-opacity="0.16"/><text x="503.0" y="98.12" font-size="17" font-weight="700" fill="#6366f1" text-anchor="middle">New</text><path d="M140 120H580" stroke="#