600" fill="#e0e7ff" text-anchor="end">How many sick days do we get?</text><rect x="110" y="196" width="470" height="160" rx="18" fill="#22222c" stroke="#2c2c38"/><text x="132" y="232" font-size="20" font-weight="700" fill="#e4e4e7">30 days in every 3-year cycle.</text><text x="132" y="264" font-size="19" font-weight="500" fill="#9a9aa8">In your first 6 months, 1 day for</text><text x="132" y="290" font-size="19" font-weight="500" fill="#9a9aa8">every 26 days worked.</text><rect x="132" y="308" width="252" height="32" rx="10" fill="#facc15" fill-opacity="0.14" stroke="#facc15" stroke-opacity="0.5"/><path d="M146 316h12l5 5v13h-17z" fill="none" stroke="#facc15" stroke-width="1.8"/><text x="172" y="330" font-size="17" font-weight="700" fill="#facc15">Leave policy · page 3</text><rect x="110" y="384" width="500" height="50" rx="25" fill="#22222c" stroke="#3f3f4a"/><text x="136" y="416" font-size="18" font-weight="500" fill="#6b6b78">Ask about your own documents…</text></svg>